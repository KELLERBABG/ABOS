<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="abos-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="abos-glow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.18" />
    </linearGradient>
    <radialGradient id="abos-center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#02050b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="128" height="128" rx="28" fill="#040813" />
  <rect width="128" height="128" rx="28" fill="none" stroke="#1e293b" stroke-width="1.5" />
  <circle cx="64" cy="60" r="48" fill="url(#abos-center)" />

  <!-- Ionosphere Plasma Reflective Arcs (Atmosphere Canopy) -->
  <path d="M 22 42 Q 64 20 106 42" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9" />
  <path d="M 32 34 Q 64 16 96 34" fill="none" stroke="#14b8a6" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5" stroke-dasharray="2 4" />

  <!-- NVIS Skywave Ray Path (Vertical Reflection Geometry) -->
  <!-- Ray 1: Left skywave bounce -->
  <path d="M 64 96 L 40 40 L 26 84" fill="none" stroke="url(#abos-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Ray 2: Right skywave bounce -->
  <path d="M 64 96 L 88 40 L 102 84" fill="none" stroke="url(#abos-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Ray 3: Vertical boresight zenith probe -->
  <line x1="64" y1="96" x2="64" y2="30" stroke="#f0f6fc" stroke-width="2" stroke-linecap="round" />

  <!-- Central Transmitter Apex Node / Diamond -->
  <polygon points="64,24 67,30 64,36 61,30" fill="#38bdf8" />
  <circle cx="64" cy="96" r="4" fill="#38bdf8" />
  <circle cx="64" cy="96" r="8" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Ground Plane Dipole -->
  <line x1="44" y1="104" x2="84" y2="104" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
  <line x1="52" y1="109" x2="76" y2="109" stroke="#475569" stroke-width="1.5" stroke-linecap="round" />
  <line x1="58" y1="114" x2="70" y2="114" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
</svg>