    <g transform="translate(26, 26) scale(1.0)">
      <path d="M 22 42 Q 64 20 106 42" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9" />
      <path d="M 32 34 Q 64 16 96 34" fill="none" stroke="#14b8a6" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5" stroke-dasharray="2 4" />
      <path d="M 64 96 L 40 40 L 26 84" fill="none" stroke="url(#bgrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 64 96 L 88 40 L 102 84" fill="none" stroke="url(#bgrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="64" y1="96" x2="64" y2="30" stroke="#f0f6fc" stroke-width="2" stroke-linecap="round" />
      <polygon points="64,24 67,30 64,36 61,30" fill="#38bdf8" />
      <circle cx="64" cy="96" r="4" fill="#38bdf8" />
      <circle cx="64" cy="96" r="8" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />
      <line x1="44" y1="104" x2="84" y2="104" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
